function circ(cx, cy, r, n = 28) {           // 위에서 시작해 반시계 방향
  const p = [];
  for (let k = 0; k <= n; k++) {
    const a = -Math.PI / 2 - (k / n) * Math.PI * 2;
    p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return p;
}

const T = {

/* =========================================================

const S = { cat:'jamo', idx:0, mode:'trace', lang:'ko', layout:'desk', deskH:0.72,

const cur = () => CHARS[S.cat][S.idx];

/* =========================================================
   3. 기하 / 채점 도구
   ========================================================= */
const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
function pathLen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += dist(p[i], p[i-1]); return L; }
function resample(pts, n) {
  const L = pathLen(pts);
  if (pts.length < 2 || L < 1e-6) return Array.from({ length:n }, () => pts[0].slice());
  const I = L / (n - 1), out = [pts[0].slice()];
  let D = 0, a = pts[0].slice();
  for (let i = 1; i < pts.length; i++) {
    const b = pts[i];
    let d = dist(a, b);
    while (D + d >= I && out.length < n) {
      const t = (I - D) / d;
      const q = [a[0] + t*(b[0]-a[0]), a[1] + t*(b[1]-a[1])];
      out.push(q); a = q; d = dist(a, b); D = 0;
    }
    D += d; a = b.slice();
  }
  while (out.length < n) out.push(pts[pts.length-1].slice());
  return out;
}
const avgDist = (A, B) => A.reduce((s, p, i) => s + dist(p, B[i]), 0) / A.length;
function partial(p, f) {
  const target = pathLen(p) * f, out = [p[0]];
  let acc = 0;
  for (let i = 1; i < p.length; i++) {
    const d = dist(p[i], p[i-1]);
    if (acc + d >= target) { const t = (target - acc) / (d || 1); out.push([p[i-1][0] + t*(p[i][0]-p[i-1][0]), p[i-1][1] + t*(p[i][1]-p[i-1][1])]); return out; }
    acc += d; out.push(p[i]);
  }
  return out;
}

/* =========================================================
   4. 캔버스 텍스처 (종이 / 조작판 / 정보판)
   ========================================================= */
const PX = 1024 / 100;
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const paperCv = mkCanvas(1024, 1024), pc = paperCv.getContext('2d');
const baseCv  = mkCanvas(1024, 1024), bc = baseCv.getContext('2d');
const inkCv   = mkCanvas(1024, 1024), kc = inkCv.getContext('2d');
const fiberCv = mkCanvas(1024, 1024);
const ctrlCv  = mkCanvas(1024, 1024), cc = ctrlCv.getContext('2d');
const infoCv  = mkCanvas(1024, 512),  ic = infoCv.getContext('2d');

(function makeFiber() {                       // 한지 질감
  const g = fiberCv.getContext('2d');
  g.fillStyle = '#f3ead6'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 1600; i++) {
    g.strokeStyle = `rgba(150,120,80,${0.03 + Math.random()*0.05})`; g.lineWidth = 1 + Math.random();
    const x = Math.random()*1024, y = Math.random()*1024, a = Math.random()*Math.PI*2, l = 8 + Math.random()*30;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a+0.6)*l/2, y + Math.sin(a+0.6)*l/2, x + Math.cos(a)*l, y + Math.sin(a)*l); g.stroke();
  }
})();

function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x+r, y);
  g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath();
}
function fit(g, text, x, y, maxW, size, weight = 700) {
  let s = size;
  do { g.font = `${weight} ${s}px ${FONT}`; if (g.measureText(text).width <= maxW) break; s -= 2; } while (s > 14);
  g.fillText(text, x, y);
}
function polyline(g, p, w, color, dash) {
  g.save(); g.strokeStyle = color; g.lineWidth = w * PX; g.lineCap = 'round'; g.lineJoin = 'round';
  if (dash) g.setLineDash(dash);
  g.beginPath(); p.forEach(([x, y], i) => i ? g.lineTo(x*PX, y*PX) : g.moveTo(x*PX, y*PX)); g.stroke(); g.restore();
}
function stamp(g, a, b, wa, wb) {             // 붓 자국: 원을 촘촘히 찍기
  const dx = (b[0]-a[0])*PX, dy = (b[1]-a[1])*PX, d = Math.hypot(dx, dy), n = Math.max(1, Math.ceil(d / 1.5));
  for (let k = 0; k <= n; k++) {
    const t = k / n, r = (wa + (wb - wa) * t) * PX / 2;
    g.beginPath(); g.arc(a[0]*PX + dx*t, a[1]*PX + dy*t, r, 0, Math.PI*2); g.fill();
  }
}
function drawStroke(g, st, color) {
  g.fillStyle = color;
  if (st.pts.length === 1) stamp(g, st.pts[0], st.pts[0], st.ws[0], st.ws[0]);
  for (let i = 1; i < st.pts.length; i++) stamp(g, st.pts[i-1], st.pts[i], st.ws[i-1], st.ws[i]);
}
function numLabel(g, pt, n) {
  const x = Math.max(4, pt[0] - 4.5) * PX, y = Math.max(4, pt[1] - 4.5) * PX;
  g.fillStyle = '#c9452f'; g.beginPath(); g.arc(x, y, 2.9*PX, 0, Math.PI*2); g.fill();
  g.fillStyle = '#fff'; g.font = `700 ${3.6*PX}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(String(n), x, y + 2);
}

let userStrokes = [], drawing = null, flash = null, watchStart = performance.now();
let paperDirty = true, ctrlDirty = true, infoDirty = true;

function buildBase() {
  bc.drawImage(fiberCv, 0, 0);
  bc.strokeStyle = 'rgba(170,50,40,.55)'; bc.lineWidth = 6; bc.strokeRect(24, 24, 976, 976);
  bc.save(); bc.strokeStyle = 'rgba(170,50,40,.25)'; bc.lineWidth = 3; bc.setLineDash([16, 14]);
  [[512,24,512,1000],[24,512,1000,512],[24,24,1000,1000],[1000,24,24,1000]].forEach(([a,b,c,d]) => {
    bc.beginPath(); bc.moveTo(a, b); bc.lineTo(c, d); bc.stroke();
  });
  bc.restore();
  if (S.mode === 'trace' || S.mode === 'watch') {
    const col = S.mode === 'trace' ? 'rgba(110,95,80,.30)' : 'rgba(110,95,80,.13)';
    cur().strokes.forEach(s => polyline(bc, s, 10, col));
  }
}
function redrawInk() {
  kc.clearRect(0, 0, 1024, 1024);
  userStrokes.forEach(st => drawStroke(kc, st, '#16110d'));
}
function drawHint(s, n) {
  polyline(pc, s, 3.2, 'rgba(225,115,30,.75)', [18, 14]);
  const a = s[s.length-2], b = s[s.length-1], ang = Math.atan2(b[1]-a[1], b[0]-a[0]);
  pc.fillStyle = 'rgba(225,115,30,.9)'; pc.beginPath();
  pc.moveTo(b[0]*PX + Math.cos(ang)*3*PX, b[1]*PX + Math.sin(ang)*3*PX);
  pc.lineTo(b[0]*PX + Math.cos(ang+2.5)*4*PX, b[1]*PX + Math.sin(ang+2.5)*4*PX);
  pc.lineTo(b[0]*PX + Math.cos(ang-2.5)*4*PX, b[1]*PX + Math.sin(ang-2.5)*4*PX); pc.fill();
  pc.fillStyle = '#2e9b57'; pc.beginPath(); pc.arc(s[0][0]*PX, s[0][1]*PX, 2.6*PX, 0, Math.PI*2); pc.fill();
  pc.fillStyle = '#fff'; pc.font = `700 ${3.2*PX}px ${FONT}`; pc.textAlign = 'center'; pc.textBaseline = 'middle';
  pc.fillText(String(n), s[0][0]*PX, s[0][1]*PX + 2);
}
function drawWatch(now) {
  const strokes = cur().strokes, durs = strokes.map(s => 0.3 + pathLen(s) / 65);
  const total = durs.reduce((a, d) => a + d + 0.25, 0) + 1.2;
  let t = ((now - watchStart) / 1000) % total;
  for (let k = 0; k < strokes.length; k++) {
    if (t >= durs[k]) { polyline(pc, strokes[k], 9, '#1b1410'); numLabel(pc, strokes[k][0], k+1); t -= durs[k] + 0.25; if (t < 0) break; }
    else { polyline(pc, partial(strokes[k], t / durs[k]), 9, '#1b1410'); numLabel(pc, strokes[k][0], k+1); break; }
  }
}
function compose(now) {
  pc.drawImage(baseCv, 0, 0); pc.drawImage(inkCv, 0, 0);
  const ch = cur();
  if (S.mode === 'watch') drawWatch(now);
  else if (S.mode !== 'free' && !S.done && (S.mode === 'trace' || S.streakFail >= 2) && S.progress < ch.strokes.length)
    drawHint(ch.strokes[S.progress], S.progress + 1);
  if (flash) drawStroke(pc, flash.st, 'rgba(200,40,30,.75)');
  paperTex.needsUpdate = true;
}

let btns = [], hoverSet = new Set(), hoverKey = '';
function drawCtrl() {
  const g = cc, t = T[S.lang]; btns = [];
  g.fillStyle = '#3a2718'; g.fillRect(0, 0, 1024, 1024);
  const add = (x, y, w, h, label, action, active, size) => btns.push({ x, y, w, h, label, action, active, size });
  ['jamo','syl','hanja'].forEach((c, i) => add(20 + i*331, 20, 315, 96, t[c], 'cat:'+c, S.cat === c, 42));
  CHARS[S.cat].forEach((c, i) => btns.push({ x: 20 + (i%6)*164, y: 136 + Math.floor(i/6)*132, w: 156, h: 128,
    label: c.ch, action: 'char:'+i, active: i === S.idx, size: 72, cell: true, stars: best[c.ch] || 0 }));
  ['watch','trace','test','free'].forEach((m, i) => add(20 + i*248, 676, 236, 92, t[m], 'mode:'+m, S.mode === m, 38));
  ['clear','listen','prev','next'].forEach((a, i) => add(20 + i*248, 784, 236, 92, t[a], a, false, 38));
  [[S.layout === 'desk' ? t.easel : t.desk, 'layout'], [t.up, 'up'], [t.down, 'down'], [t.lang, 'lang']]
    .forEach(([l, a], i) => add(20 + i*248, 892, 236, 92, l, a, false, 36));
  btns.forEach((b, i) => {
    const hov = hoverSet.has(i);
    g.fillStyle = b.active ? '#c9452f' : (hov ? '#fff3d6' : '#efe1c2'); rr(g, b.x, b.y, b.w, b.h, 14); g.fill();
    if (hov) { g.strokeStyle = '#ffd28a'; g.lineWidth = 6; g.stroke(); }

  camera.fov = innerWidth < innerHeight ? 80 : 55;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
dispatchEvent(new Event('resize'));
renderer.xr.addEventListener('sessionstart', () => { initAudio(); document.getElementById('help').style.display = 'none'; });
renderer.xr.addEventListener('sessionend', () => { document.getElementById('help').style.display = ''; layoutScene(); });

// 한글 웹폰트는 글자 범위별로 나뉘어 있어 쓰는 글자를 미리 불러옴
const ALL = Object.values(CHARS).flat().map(c => c.ch + c.name + c.ko).join('') +
            Object.values(T.ko).join('') + Object.values(T.en).join('') + '★☆·◀▶0123456789/';
Promise.all([document.fonts.load(`400 40px "Noto Serif KR"`, ALL), document.fonts.load(`700 40px "Noto Serif KR"`, ALL)])
  .then(() => { ctrlDirty = infoDirty = paperDirty = true; }).catch(() => {});

layoutScene();
resetChar();
</script>
