function circ(cx, cy, r, n = 28) {           // 위에서 시작해 반시계 방향
  const p = [];
  for (let k = 0; k <= n; k++) {
    const a = -Math.PI / 2 - (k / n) * Math.PI * 2;
    p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return p;
}

const place = (strokes, [x0,y0,x1,y1]) => strokes.map(s => s.map(([x,y]) => [x0 + x/100*(x1-x0), y0 + y/100*(y1-y0)]));
function jamoStrokes(j) {                     // 겹자음·겹받침은 두 자모를 나란히
  if (JAMO[j]) return JAMO[j];
  const [a, b] = [...PAIR[j]];
  return [...place(JAMO[a], [0,0,54,100]), ...place(JAMO[b], [46,0,100,100])];
}
function sylStrokes(ch) {                     // 한글 음절을 자모로 풀어 자리에 배치
  const c = ch.charCodeAt(0) - 0xAC00;
  const C = CHO[Math.floor(c / 588)], V = JUNG[Math.floor(c % 588 / 28)], F = JONG[c % 28];
  const P = (j, box) => place(jamoStrokes(j), box);
  if (MIX[V]) {
    const [h, v] = [...MIX[V]];
    return F ? [...P(C,[5,0,60,40]), ...P(h,[0,22,66,62]), ...P(v,[45,0,100,62]), ...P(F,[12,55,88,100])]
             : [...P(C,[5,0,62,55]), ...P(h,[0,38,68,98]), ...P(v,[45,0,100,100])];
  }
  if ('ㅗㅛㅜㅠㅡ'.includes(V))
    return F ? [...P(C,[20,0,80,38]), ...P(V,[5,28,95,63]), ...P(F,[15,55,85,100])]
             : [...P(C,[15,2,85,55]), ...P(V,[5,40,95,100])];
  return F ? [...P(C,[0,0,56,56]), ...P(V,[40,0,100,62]), ...P(F,[10,50,90,100])]
           : [...P(C,[0,5,58,95]), ...P(V,[42,0,100,100])];
}
function romanize(word) {
  return [...word].map(ch => {
    const c = ch.charCodeAt(0) - 0xAC00;
    return R_CHO[Math.floor(c / 588)] + R_JUNG[Math.floor(c % 588 / 28)] + R_JONG[c % 28];
  }).join('-');
}

const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
function pathLen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += dist(p[i], p[i-1]); return L; }
function resample(pts, n) {
  const L = pathLen(pts);
  if (pts.length < 2 || L < 1e-6) return Array.from({ length:n }, () => pts[0].slice());
  const I = L / (n - 1), out = [pts[0].slice()];
  let D = 0, a = pts[0].slice();
  for (let i = 1; i < pts.length; i++) {
    const b = pts[i];
    let d = dist(a, b);
    while (D + d >= I && out.length < n) {
      const t = (I - D) / d;
      const q = [a[0] + t*(b[0]-a[0]), a[1] + t*(b[1]-a[1])];
      out.push(q); a = q; d = dist(a, b); D = 0;
    }
    D += d; a = b.slice();
  }
  while (out.length < n) out.push(pts[pts.length-1].slice());
  return out;
}
const avgDist = (A, B) => A.reduce((s, p, i) => s + dist(p, B[i]), 0) / A.length;
function partial(p, f) {
  const target = pathLen(p) * f, out = [p[0]];

  for (let i = 1; i < p.length; i++) {
    const d = dist(p[i], p[i-1]);
    if (acc + d >= target) { const t = (target - acc) / (d || 1); out.push([p[i-1][0] + t*(p[i][0]-p[i-1][0]), p[i-1][1] + t*(p[i][1]-p[i-1][1])]); return out; }
    acc += d; out.push(p[i]);
  }
  return out;
}

function rr(g, x, y, w, h, r) {

}

  infoMesh.position.set(0.74, h + 0.36, -0.42); infoMesh.rotation.set(-0.1, -0.62, 0, 'YXZ');
  post.visible = false;
  camera.position.set(0, h + 0.86, 1.05);
  camera.lookAt(0, h + 0.5, -0.55);
  scene.updateMatrixWorld(true);
}

/* =========================================================
   7. 소리 / 발음 / 진동
   ========================================================= */
let AC = null;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  env.startAmbience(AC);
}
function tone(f, t0, dur, vol = 0.1, type = 'sine') {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + t0;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  click: () => tone(660, 0, 0.05, 0.05),
  ok:    () => tone(880, 0, 0.12, 0.08),
  fail:  () => tone(220, 0, 0.25, 0.1, 'triangle'),
  done:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, 0.3, 0.09)),
};
function tts(text) {                          // 음성 파일이 없을 때의 예비 수단
  try {
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = 0.85;
    const v = speechSynthesis.getVoices().find(v => (v.lang || '').toLowerCase().startsWith('ko')); if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
const sndCache = {};
function speak(delay = 0) {                   // 녹음된 발음 파일 재생
  const it = curItem(), id = sndId(it.text);
  let a = sndCache[id];
  if (!a) { a = sndCache[id] = new Audio(`snd_${id}.wav`); a.addEventListener('error', () => { a.failed = true; tts(it.speak); }); }
  setTimeout(() => {
    if (a.failed) return tts(it.speak);
    try { a.currentTime = 0; a.play().catch(() => {}); } catch (e) {}
  }, delay);
}
const ctrls = [], hands = [], xrHover = [-1, -1];
function haptic(i, v, ms) {
  if (typeof i !== 'number') return;
  try {
    const g = ctrls[i]?.userData.src?.gamepad, a = g?.hapticActuators?.[0];
    if (a?.pulse) a.pulse(v, ms);
    else g?.vibrationActuator?.playEffect?.('dual-rumble', { duration: ms, strongMagnitude: v, weakMagnitude: v });
  } catch (e) {}
}

/* =========================================================
   8. 쓰기 / 채점
   ========================================================= */
const wOf = p => 1.8 + p * 7.5;              // 누르는 깊이 → 붓 굵기(0~100 단위)
function setMsg(key, color = '#3b2a1c') { S.msgKey = key; S.msgColor = color; infoDirty = true; }
const startMsg = () => setMsg(isDict() ? 'dictMsg' : mode() === 'watch' ? 'watchMsg' : mode() === 'free' ? 'freeMsg' : 'start');
function resetChar() {                        // 글자 한 자 새로 시작
  Object.assign(S, { progress: 0, streakFail: 0, nextAt: 0 });
  userStrokes = []; drawing = null; flash = null; watchStart = performance.now();
  buildBase(); redrawInk(); paperDirty = ctrlDirty = infoDirty = true;
}
function resetItem() {                        // 낱말(또는 글자) 처음부터
  Object.assign(S, { ci: 0, mistakes: 0, done: false, stars: 0 });
  resetChar(); startMsg();
}
const canDraw = () => mode() !== 'watch' && !S.nextAt;
function beginStroke(owner, pt, p) {
  drawing = { owner, pts: [pt], ws: [wOf(p)], p };
  kc.fillStyle = '#16110d'; stamp(kc, pt, pt, drawing.ws[0], drawing.ws[0]); paperDirty = true;
}
function addPoint(pt, p) {
  const d = drawing; d.p = d.p * 0.75 + p * 0.25;
  const last = d.pts[d.pts.length - 1], w = wOf(d.p);
  if (dist(last, pt) < 0.35) return;
  kc.fillStyle = '#16110d'; stamp(kc, last, pt, d.ws[d.ws.length - 1], w);
  d.pts.push(pt); d.ws.push(w); paperDirty = true;
}
function endStroke() { const st = drawing; drawing = null; if (st) evaluate(st); }

function evaluate(st) {
  const m = mode();
  if (m === 'free') { userStrokes.push(st); return; }
  const strokes = curStrokes(), k = S.progress;
  if (S.done || S.nextAt || k >= strokes.length) { redrawInk(); paperDirty = true; return; }
  const R = resample(st.pts, 24), E = resample(strokes[k], 24);
  const thr = m === 'trace' ? 13 : 16;
  if (avgDist(R, E) < thr) {
    userStrokes.push(st); S.progress++; S.streakFail = 0;
    haptic(st.owner, 0.5, 40);
    if (S.progress < strokes.length) { setMsg('good', '#2e7d4a'); sfx.ok(); }
    else if (S.ci < curChars().length - 1) {  // 낱말의 다음 글자로
      setMsg('nextSyl', '#2e7d4a'); sfx.ok(); S.nextAt = performance.now() + 900;
    } else {
      const it = curItem(), n = curChars().length;
      S.done = true; S.stars = S.mistakes === 0 ? 3 : S.mistakes <= 2 * n ? 2 : 1;
      best[bestKey(it)] = Math.max(best[bestKey(it)] || 0, S.stars); save();
      setMsg('done', '#2e7d4a'); sfx.done(); speak(500); haptic(st.owner, 0.9, 150); ctrlDirty = true;
    }
  } else {
    S.mistakes++; S.streakFail++;
    let why = 'shape';
    if (avgDist(R, E.slice().reverse()) < thr) why = 'dir';
    else if (strokes.some((s, j) => j > k && avgDist(R, resample(s, 24)) < thr)) why = 'order';
    setMsg(m === 'test' && S.streakFail === 2 ? 'hint' : why, '#b23a26');
    flash = { st, until: performance.now() + 700 };
    redrawInk(); sfx.fail(); haptic(st.owner, 0.25, 120);
  }
  paperDirty = true;
}

/* =========================================================
   9. 버튼 동작
   ========================================================= */
function btnIndexAt(uv) {
  const x = uv.x * 1024, y = (1 - uv.y) * 1024;
  return btns.findIndex(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
}
function act(a) {
  initAudio(); sfx.click();
  const n = items().length;
  let say = false;
  if (a.startsWith('tab:')) { S.tab = a.slice(4); if (S.tab === 'word' && S.grade === 'h') S.grade = 1; S.idx = 0; resetItem(); say = true; }
  else if (a.startsWith('grade:')) { const v = a.slice(6); S.grade = v === 'h' ? 'h' : +v; S.idx = 0; resetItem(); say = true; }
  else if (a.startsWith('item:')) { S.idx = +a.slice(5); resetItem(); say = true; }
  else if (a.startsWith('mode:')) { S.mode = a.slice(5); resetItem(); }
  else if (a === 'clear') resetItem();
  else if (a === 'listen') say = true;
  else if (a === 'prev') { S.idx = (S.idx - 1 + n) % n; resetItem(); say = true; }
  else if (a === 'next') { S.idx = (S.idx + 1) % n; resetItem(); say = true; }
  else if (a === 'layout') { S.layout = S.layout === 'desk' ? 'easel' : 'desk'; layoutScene(); }
  else if (a === 'up') { S.deskH = Math.min(1.25, +(S.deskH + 0.04).toFixed(2)); layoutScene(); }
  else if (a === 'down') { S.deskH = Math.max(0.45, +(S.deskH - 0.04).toFixed(2)); layoutScene(); }
  else if (a === 'lang') S.lang = LANGS[(LANGS.indexOf(S.lang) + 1) % LANGS.length];
  if (say) speak(120);
  save(); ctrlDirty = infoDirty = paperDirty = true;
}

/* =========================================================
   10. 입력 — PC 마우스/터치
   ========================================================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const dom = renderer.domElement;
let mouseHover = -1;
function pick(e, objs) {
  const r = dom.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(objs, false)[0];
}
const uvUnits = uv => [uv.x * 100, (1 - uv.y) * 100];
dom.addEventListener('pointerdown', e => {
  if (renderer.xr.isPresenting) return;
  initAudio();
  const h = pick(e, [ctrlMesh, paper]); if (!h) return;
  if (h.object === ctrlMesh) { const i = btnIndexAt(h.uv); if (i >= 0) act(btns[i].action); }
  else if (canDraw() && !drawing) { beginStroke('mouse', uvUnits(h.uv), 0.5); dom.setPointerCapture(e.pointerId); }
});
dom.addEventListener('pointermove', e => {
  if (renderer.xr.isPresenting) return;
  if (drawing && drawing.owner === 'mouse') { const h = pick(e, [paper]); if (h) addPoint(uvUnits(h.uv), 0.5); return; }
  const h = pick(e, [ctrlMesh]); mouseHover = h ? btnIndexAt(h.uv) : -1;
  dom.style.cursor = mouseHover >= 0 ? 'pointer' : 'default';
});
const mouseUp = () => { if (drawing && drawing.owner === 'mouse') endStroke(); };
dom.addEventListener('pointerup', mouseUp);
dom.addEventListener('pointercancel', mouseUp);

/* =========================================================
   11. 입력 — Quest 컨트롤러 / 핸드트래킹
   ========================================================= */
const handFactory = new XRHandModelFactory();
function makeBrush() {
  const g = new THREE.Group();
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.009, 0.16, 12), std(0xc8a165, { roughness: 0.5 }));
  handle.rotation.x = Math.PI / 2; handle.position.z = -0.015; g.add(handle);
  const tipM = new THREE.Mesh(new THREE.ConeGeometry(0.011, 0.04, 12), std(0x111111, { roughness: 0.9 }));
  tipM.rotation.x = -Math.PI / 2; tipM.position.z = -0.11; g.add(tipM);
  return g;
}
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  const brush = makeBrush(); c.add(brush);
  const tip = new THREE.Object3D(); tip.position.z = -0.13; c.add(tip);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0xffd28a, transparent: true, opacity: 0.6 }));
  c.add(line);
  c.userData = { brush, tip, line, src: null };
  c.addEventListener('connected', e => { c.userData.src = e.data; brush.visible = !e.data.hand; });
  c.addEventListener('disconnected', () => { c.userData.src = null; if (drawing && drawing.owner === i) endStroke(); });
  c.addEventListener('selectstart', () => {
    initAudio();
    const h = xrHover[i]; if (h >= 0 && btns[h]) { act(btns[h].action); haptic(i, 0.4, 30); }
  });
  scene.add(c); ctrls.push(c);
  const hand = renderer.xr.getHand(i);
  hand.add(handFactory.createHandModel(hand, 'spheres'));
  scene.add(hand); hands.push(hand);
}
function tipOf(i) {
  const c = ctrls[i], src = c.userData.src; if (!src) return null;
  if (src.hand) {
    const j = hands[i].joints && hands[i].joints['index-finger-tip'];
    return j && j.visible ? j.getWorldPosition(new THREE.Vector3()) : null;
  }
  return c.visible ? c.userData.tip.getWorldPosition(new THREE.Vector3()) : null;
}
const toUnits = L => [(L.x / PW + 0.5) * 100, (0.5 - L.y / PH) * 100];
const pressure = z => THREE.MathUtils.clamp((0.008 - z) / 0.035, 0, 1);
const tmpM = new THREE.Matrix4();
function updateXR() {
  let near = null;
  for (let i = 0; i < 2; i++) {
    const c = ctrls[i], line = c.userData.line;
    const tip = tipOf(i);
    if (!tip) { if (drawing && drawing.owner === i) endStroke(); line.visible = false; xrHover[i] = -1; continue; }
    const L = paper.worldToLocal(tip);
    const inside = Math.abs(L.x) < PW / 2 && Math.abs(L.y) < PH / 2;
    if (drawing && drawing.owner === i) {
      if (!inside || L.z > 0.018 || L.z < -0.2) endStroke();
      else addPoint(toUnits(L), pressure(L.z));
    } else if (!drawing && canDraw() && inside && L.z < 0.008 && L.z > -0.05) {
      beginStroke(i, toUnits(L), pressure(L.z)); haptic(i, 0.35, 25);
    }
    const nearPaper = inside && L.z < 0.15 && L.z > -0.2;
    if (nearPaper && (!near || L.z < near.z)) near = { x: L.x, y: L.y, z: L.z, touching: drawing && drawing.owner === i };
    // 레이저로 버튼 가리키기
    c.updateMatrixWorld(true);
    tmpM.identity().extractRotation(c.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(c.matrixWorld);
    ray.ray.direction.set(0, 0, -1).applyMatrix4(tmpM);
    const h = ray.intersectObjects([ctrlMesh, infoMesh], false)[0];
    if (h && h.object === ctrlMesh) {
      xrHover[i] = btnIndexAt(h.uv); line.visible = true; line.scale.z = h.distance; line.material.opacity = 0.95;
    } else {
      xrHover[i] = -1; line.visible = !nearPaper; line.scale.z = h ? h.distance : 0.5; line.material.opacity = 0.35;
    }
  }
  if (near && mode() !== 'watch') {           // 붓끝 그림자 링: 높이 감 잡기용
    ring.visible = true; ring.position.set(near.x, near.y, 0.0015);
    const s = 1 + Math.max(0, near.z) * 30; ring.scale.set(s, s, 1);
    ring.material.color.set(near.touching ? 0x2e9b57 : 0x2a1c10);
  } else ring.visible = false;
}

/* =========================================================
   12. 루프
   ========================================================= */
function updateHover() {
  const s = new Set();
  if (!renderer.xr.isPresenting && mouseHover >= 0) s.add(mouseHover);
  if (renderer.xr.isPresenting) xrHover.forEach(h => { if (h >= 0) s.add(h); });
  const key = [...s].sort().join(',');
  if (key !== hoverKey) { hoverKey = key; hoverSet = s; ctrlDirty = true; }
}
renderer.setAnimationLoop(() => {
  const now = performance.now();
  if (renderer.xr.isPresenting) updateXR(); else ring.visible = false;
  updateHover(); env.tick(now);
  if (flash && now >= flash.until) { flash = null; paperDirty = true; }
  if (S.nextAt && now >= S.nextAt) { S.ci++; resetChar(); startMsg(); }
  if (mode() === 'watch') { watchTick(now); paperDirty = true; }
  if (paperDirty) { compose(now); paperDirty = false; }
  if (ctrlDirty) { drawCtrl(); ctrlTex.needsUpdate = true; ctrlDirty = false; }
  if (infoDirty) { drawInfo(); infoTex.needsUpdate = true; infoDirty = false; }
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = innerWidth < innerHeight ? 80 : 55;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
dispatchEvent(new Event('resize'));
renderer.xr.addEventListener('sessionstart', () => { initAudio(); document.getElementById('help').style.display = 'none'; });
renderer.xr.addEventListener('sessionend', () => { document.getElementById('help').style.display = ''; layoutScene(); });

// 웹폰트는 글자 범위별로 나뉘어 있어 쓰는 글자를 미리 불러옴
const ALL = [...JAMO_ITEMS, ...HANJA_ITEMS, ...Object.values(WORDS).flat()].map(c => c.text + c.name + Object.values(c.mean).join('') + c.rom).join('') +
            Object.values(T).map(t => Object.values(t).map(v => typeof v === 'function' ? v(1) : v).join('')).join('') +
            Object.values(LANG_NAME).join('') + '★☆·◀▶○?0123456789/';
Promise.all(['Noto Serif', 'Noto Serif KR'].flatMap(f => [400, 700].map(w => document.fonts.load(`${w} 40px "${f}"`, ALL))))
  .then(() => { ctrlDirty = infoDirty = paperDirty = true; }).catch(() => {});

// 시험용: 콘솔에서 butgilDebug.writeNext() 를 부르면 다음 획을 정답대로 써 줌
window.butgilDebug = {
  state: S, camera,
  writeNext() {
    const s = curStrokes()[S.progress];
    if (!s || !canDraw() || S.done) return false;
    evaluate({ owner: 'debug', pts: s.map(p => p.slice()), ws: s.map(() => 5) });
    redrawInk(); paperDirty = true; return true;
  },
};

layoutScene();
resetItem();
</script>
